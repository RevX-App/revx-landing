<!doctype html>
<html><head><meta charset="utf-8"><title>Repair Order sketch</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;background:#1A1A1A;font-family:"Courier New",monospace;overflow:hidden;position:relative}
.pink{position:absolute;left:150px;top:70px;width:1180px;height:800px;background:#F4B6C2;transform:rotate(2deg)}
.can{position:absolute;left:120px;top:50px;width:1180px;height:800px;background:#F2D94E;transform:rotate(-1deg)}
.ro{position:absolute;left:100px;top:36px;width:1180px;height:820px;background:#FBFBF8;padding:40px 50px;color:#1A1A1A}
.top{display:flex;justify-content:space-between;border-bottom:3px solid #1A1A1A;padding-bottom:14px}
.wm{font-family:Arial,sans-serif;font-size:56px;font-weight:700;letter-spacing:-2px}.wm b{color:#38BDF8}
.no{font-size:26px;text-align:right}.no b{color:#C8102E;font-size:34px}
h1{font-family:Arial,sans-serif;font-size:72px;letter-spacing:-2px;margin:26px 0 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border:2px solid #1A1A1A}
.box{border:1px solid #1A1A1A;padding:16px;min-height:200px}
.box h4{font-size:14px;letter-spacing:2px}
.hand{font-family:"Segoe Print","Comic Sans MS",cursive;color:#1F3FBF;font-size:28px;line-height:1.5;margin-top:10px}
.sig{display:flex;gap:40px;margin-top:24px;font-size:14px}.sig div{flex:1;border-top:2px solid #1A1A1A;padding-top:6px}
.stamp{position:absolute;right:90px;bottom:120px;border:6px solid #C8102E;color:#C8102E;font-family:Arial,sans-serif;font-weight:900;font-size:40px;padding:14px 28px;transform:rotate(-8deg);letter-spacing:3px}
</style></head><body>
<div class="pink"></div><div class="can"></div>
<div class="ro">
<div class="top"><div class="wm">Rev<b>X</b></div><div class="no">REPAIR ORDER<br><b>Nº 0001</b></div></div>
<h1>Every problem, written up right.</h1>
<div class="grid">
<div class="box"><h4>CUSTOMER COMPLAINT</h4><div class="hand">Grinding, front left, only when braking. Few days, getting worse.</div></div>
<div class="box"><h4>TECHNICIAN'S FINDINGS (AI)</h4><div class="hand">1. Worn front pads<br>2. Glazed rotor<br>3. Caliper slide</div></div>
</div>
<div class="sig"><div>CUSTOMER SIGN-OFF</div><div>MECHANIC SIGN-OFF</div><div>REVIEW (SEALED)</div></div>
</div>
<div class="stamp">OPEN REVX</div>
</body></html>
